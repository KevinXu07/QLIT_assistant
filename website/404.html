<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 · QLIT 小助手</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F1EC">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="stylesheet" href="/assets/css/site.css">
<script>
(function () {
  var t = null; try { t = localStorage.getItem('qlit-theme'); } catch (e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#141312';
})();
</script>
<style>
.nf { min-height: 100vh; min-height: 100svh; display: grid; place-content: center; justify-items: start; gap: 0; padding: 48px 28px; max-width: 560px; margin: 0 auto; }
.nf .s-brand { margin-bottom: 56px; }
.nf-code { margin: 0; font-size: clamp(96px, 22vw, 160px); line-height: .9; font-weight: 700; color: var(--ink); }
.nf h1 { margin: 20px 0 10px; font-size: clamp(24px, 5vw, 32px); font-weight: 700; }
.nf p.nf-lede { margin: 0 0 32px; color: var(--ink-2); font-size: 16px; line-height: 1.7; }
</style>
</head>
<body>
<main class="nf">
  <a class="s-brand" href="/"><img src="/assets/img/icon-64.png" alt="" width="32" height="32">QLIT 小助手</a>
  <p class="nf-code num">404</p>
  <h1>这一页不在课表上</h1>
  <p class="nf-lede">链接可能已经失效，或者地址输错了。</p>
  <a class="s-btn s-btn-ink" href="/">回到首页</a>
</main>
</body>
</html>
