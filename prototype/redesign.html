<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QLIT 小助手 重设计原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --num: "Barlow Semi Condensed", "DIN Alternate", system-ui, sans-serif;
  --cjk: system-ui, "PingFang SC", "MiSans", "HarmonyOS Sans SC", "OPPO Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --ease-out: cubic-bezier(.32, .72, 0, 1);
}
[data-theme="light"] {
  --page: #E3E0DA;
  --bg: #F3F1EC;
  --surface: #FFFFFF;
  --surface-2: #EBE8E2;
  --ink: #1D1B18;
  --ink-2: #6B665E;
  --ink-3: #A39D93;
  --line: rgba(29, 27, 24, .08);
  --seal: #C8161D;
  --seal-soft: rgba(200, 22, 29, .1);
  --glass: rgba(255, 255, 255, .58);
  --glass-edge: rgba(255, 255, 255, .85);
  --glass-shadow: 0 8px 28px rgba(60, 40, 20, .14), 0 1px 2px rgba(60, 40, 20, .08);
  --scrim: rgba(20, 16, 12, .32);
  /* course tint: background / bar / text, hue supplied per element */
  --cb-l: .935; --cb-c: .042;
  --cr-l: .64;  --cr-c: .13;
  --ct-l: .36;  --ct-c: .085;
  --tint-l: .93; --tint-c: .05;
  --glyph-l: .52; --glyph-c: .15;
}
[data-theme="dark"] {
  --page: #0A0A09;
  --bg: #141312;
  --surface: #1F1D1B;
  --surface-2: #2B2825;
  --ink: #F2EFEA;
  --ink-2: #A8A29A;
  --ink-3: #6E6962;
  --line: rgba(255, 255, 255, .07);
  --seal: #CC2A31;
  --seal-soft: rgba(230, 70, 76, .16);
  --glass: rgba(44, 41, 38, .58);
  --glass-edge: rgba(255, 255, 255, .1);
  --glass-shadow: 0 8px 28px rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .5);
  --cb-l: .31;  --cb-c: .05;
  --cr-l: .72;  --cr-c: .12;
  --ct-l: .9;   --ct-c: .05;
  --tint-l: .3; --tint-c: .055;
  --glyph-l: .8; --glyph-c: .12;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--cjk);
  background: var(--page);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  transition: background-color .3s;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: 0; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- prototype page chrome ---------- */
.deck-head {
  max-width: 1320px; margin: 0 auto; padding: 28px 28px 8px;
  display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between;
}
.deck-head h1 { font-size: 20px; font-weight: 650; margin: 0 0 4px; }
.deck-head p { margin: 0; color: var(--ink-2); font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { padding: 6px 14px; border-radius: 999px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.clock { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.clock output { font-family: var(--num); font-size: 20px; font-weight: 600; color: var(--ink); width: 52px; }
.clock input { width: 200px; accent-color: var(--seal); }

.deck {
  max-width: 1320px; margin: 0 auto; padding: 20px 28px 48px;
  display: flex; flex-wrap: wrap; gap: 36px; justify-content: center;
}
.slot { display: flex; flex-direction: column; gap: 14px; width: 390px; }
.caption { font-size: 13px; line-height: 1.6; color: var(--ink-2); margin: 0 6px; }
.caption b { color: var(--ink); font-weight: 600; }

/* ---------- phone ---------- */
.phone {
  position: relative; width: 390px; height: 844px; border-radius: 52px; overflow: hidden;
  background: var(--bg); isolation: isolate;
  box-shadow: 0 0 0 10px #1a1918, 0 0 0 11px #3a3836, 0 30px 60px rgba(0,0,0,.25);
  transition: background-color .3s;
}
@media (max-width: 440px) {
  .slot, .phone { width: 100vw; }
  .phone { border-radius: 0; box-shadow: none; height: 100svh; }
  .deck { padding: 0; gap: 0; }
  .caption { display: none; }
}
.status {
  position: absolute; inset: 0 0 auto; height: 46px; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px;
  font-family: var(--num); font-weight: 600; font-size: 16px; pointer-events: none;
  background: linear-gradient(var(--bg) 70%, transparent);
}
.status .bars { display: flex; gap: 6px; align-items: center; }
.status .bars i { display: block; background: currentColor; border-radius: 2px; }
.gesture { position: absolute; bottom: 8px; left: 50%; width: 132px; height: 5px; margin-left: -66px; border-radius: 3px; background: var(--ink); opacity: .85; z-index: 30; }

.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 54px 0 120px; }
.screen::-webkit-scrollbar { display: none; }
.screen[hidden] { display: none; }

/* ---------- bottom bar (liquid glass) ---------- */
.tabbar {
  position: absolute; z-index: 20; bottom: 26px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px; padding: 5px; border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(1.7); backdrop-filter: blur(22px) saturate(1.7);
  box-shadow: var(--glass-shadow), inset 0 0 0 1px var(--glass-edge);
}
.tabbar button {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  width: 76px; padding: 7px 0 6px; border-radius: 999px; font-size: 11px; color: var(--ink-2);
  transition: color .2s;
}
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--seal); }
.tabbar .pill {
  position: absolute; top: 5px; bottom: 5px; left: 5px; width: 76px; border-radius: 999px;
  background: var(--seal-soft); transition: transform .38s var(--ease-out);
}

/* ---------- home ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 14px; }
.topbar .date { font-size: 19px; font-weight: 650; letter-spacing: .01em; }
.topbar .sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); font-size: 15px; font-weight: 600; color: var(--ink);
}

.hero {
  position: relative; margin: 0 16px; padding: 18px 20px 18px; border-radius: 28px; overflow: hidden;
  background: var(--seal); color: #fff;
  box-shadow: 0 14px 30px -12px rgba(200, 22, 29, .55);
}
[data-theme="dark"] .hero { box-shadow: none; }
.hero .seal-wm { position: absolute; width: 230px; height: 230px; right: -78px; top: -34px; color: #fff; opacity: .13; pointer-events: none; }
.hero-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: rgba(255,255,255,.82); }
.hero-top .num { font-size: 15px; font-weight: 600; color: #fff; }
.hero h2 { margin: 10px 0 6px; font-size: 29px; line-height: 1.15; font-weight: 700; letter-spacing: .01em; max-width: 92%; }
.hero-where { display: flex; align-items: baseline; gap: 12px; font-size: 14px; color: rgba(255,255,255,.82); }
.hero-where .num { font-size: 22px; font-weight: 600; color: #fff; }
.hero-count { margin-top: 22px; display: flex; align-items: baseline; gap: 4px; }
.hero-count .num { font-size: 46px; line-height: .9; font-weight: 600; }
.hero-count small { font-size: 15px; margin-right: 6px; color: rgba(255,255,255,.9); }
.hero-count .tail { font-size: 14px; color: rgba(255,255,255,.75); margin-left: 4px; }
.track { position: relative; height: 6px; margin-top: 16px; border-radius: 3px; background: rgba(255,255,255,.16); }
.track .seg-c { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: rgba(255,255,255,.34); }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: rgba(255,255,255,.9); mix-blend-mode: normal; clip-path: inset(0 0 0 0); }
.track .now { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(200,22,29,1), 0 0 0 4px rgba(255,255,255,.5); }
.track-scale { display: flex; justify-content: space-between; margin-top: 7px; font-size: 12px; color: rgba(255,255,255,.7); }

.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); margin: 22px 12px 4px; }
.week-strip button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 16px; }
.week-strip .wd { font-size: 12px; color: var(--ink-3); }
.week-strip .dn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--num); font-size: 19px; font-weight: 600; transition: background-color .2s, color .2s, box-shadow .2s;
}
.week-strip .dots { display: flex; gap: 3px; height: 5px; }
.week-strip .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); opacity: .7; }
.week-strip .is-today .dn { background: var(--seal); color: #fff; }
.week-strip .is-today .wd { color: var(--seal); font-weight: 600; }
.week-strip .is-sel:not(.is-today) .dn { box-shadow: inset 0 0 0 1.5px var(--ink); }

.day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 22px 6px; }
.day-head h3 { margin: 0; font-size: 17px; font-weight: 650; }
.day-head span { font-size: 13px; color: var(--ink-2); }

.timeline { list-style: none; margin: 0; padding: 4px 16px 0; }
.tl {
  display: grid; grid-template-columns: 48px 22px 1fr auto; align-items: start;
  padding: 0; cursor: pointer; border-radius: 16px; transition: opacity .3s;
}
.tl:hover { background: var(--line); }
.tl .t { padding-top: 13px; text-align: right; }
.tl .t b { display: block; font-family: var(--num); font-size: 18px; font-weight: 600; line-height: 1.1; }
.tl .t span { font-family: var(--num); font-size: 14px; color: var(--ink-3); }
.tl .rail { position: relative; align-self: stretch; }
.tl .rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px; margin-left: -.75px; background: var(--line); }
.tl:first-child .rail::before { top: 20px; }
.tl:last-child .rail::before { bottom: calc(100% - 20px); }
.tl .dot {
  position: absolute; left: 50%; top: 17px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%;
  background: oklch(var(--cr-l) var(--cr-c) var(--h)); box-shadow: 0 0 0 3px var(--bg);
}
.tl .body { padding: 11px 6px 14px 4px; min-width: 0; }
.tl .body b { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; }
.tl .body span { font-size: 13px; color: var(--ink-2); }
.tl .room { padding: 13px 10px 0 0; font-family: var(--num); font-size: 17px; font-weight: 600; color: var(--ink-2); }
.tl.is-done { opacity: .42; }
.tl.is-next .dot, .tl.is-now .dot { background: var(--seal); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5.5px var(--seal-soft); }
.tl.is-now .dot { animation: pulse 2.4s ease-in-out infinite; }
.tl.is-now .body b, .tl.is-next .body b { color: var(--seal); }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px var(--bg), 0 0 0 9px transparent; } }
.gap { display: grid; grid-template-columns: 48px 22px 1fr; }
.gap .rail { position: relative; height: 34px; }
.gap .rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; margin-left: -.75px; border-left: 1.5px dashed var(--line); }
.gap span { align-self: center; font-size: 12px; color: var(--ink-3); padding-left: 4px; }
.empty-day { margin: 8px 22px; padding: 26px 0; text-align: center; color: var(--ink-3); font-size: 14px; border: 1.5px dashed var(--line); border-radius: 20px; }

.shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 26px 12px 0; padding: 16px 4px; background: var(--surface); border-radius: 24px; }
.shortcuts button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; border-radius: 14px; }
.ticon {
  position: relative; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%;
  background: oklch(var(--tint-l) var(--tint-c) var(--h)); color: oklch(var(--glyph-l) var(--glyph-c) var(--h));
}
.ticon .badge {
  position: absolute; top: -3px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
  background: var(--seal); color: #fff; font-family: var(--num); font-size: 12.5px; font-weight: 600; line-height: 19px; text-align: center;
  box-shadow: 0 0 0 2.5px var(--surface);
}
.shortcuts .lb { font-size: 13px; }
.shortcuts .st { font-size: 11.5px; color: var(--ink-3); margin-top: -4px; }

/* ---------- week grid ---------- */
.wk-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 12px 22px; }
.wk-head h2 { margin: 0; font-size: 26px; font-weight: 700; display: flex; align-items: baseline; gap: 4px; }
.wk-head h2 .num { font-size: 32px; line-height: 1; }
.wk-head p { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); }
.wk-nav { display: flex; align-items: center; gap: 2px; }
.wk-nav button.ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.wk-nav button.ic:hover { background: var(--line); }
.wk-nav .back { padding: 6px 12px; border-radius: 999px; background: var(--seal-soft); color: var(--seal); font-size: 13px; font-weight: 600; margin-right: 4px; }

.grid-wrap { touch-action: pan-y; }
.grid-wrap.anim-l { animation: inL .32s var(--ease-out); }
.grid-wrap.anim-r { animation: inR .32s var(--ease-out); }
@keyframes inL { from { transform: translateX(36px); opacity: .2; } }
@keyframes inR { from { transform: translateX(-36px); opacity: .2; } }
.days, .grid { display: grid; grid-template-columns: 22px repeat(var(--cols), 1fr); column-gap: 4px; padding: 0 10px 0 6px; }
.days { position: sticky; top: -54px; z-index: 5; padding-top: 4px; padding-bottom: 8px; background: var(--bg); }
.days div { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--ink-3); }
.days div b { font-family: var(--num); font-size: 17px; font-weight: 600; color: var(--ink); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; }
.days div.is-today { color: var(--seal); font-weight: 600; }
.days div.is-today b { background: var(--seal); color: #fff; }
.grid { position: relative; grid-auto-rows: 104px; row-gap: 4px; }
.grid .sec { display: flex; flex-direction: column; align-items: center; padding-top: 6px; gap: 30px; font-family: var(--num); font-size: 13px; font-weight: 600; color: var(--ink-3); border-top: 1px solid var(--line); }
.grid .sec.lunch { gap: 0; }
.grid .cell { border-top: 1px solid var(--line); padding-top: 3px; min-width: 0; }
.grid .cell.today { background: color-mix(in oklab, var(--seal) 4%, transparent); }
[data-theme="dark"] .grid .cell.today { background: rgba(255,255,255,.025); }
.cblk {
  height: 100%; width: 100%; text-align: left; border-radius: 12px; padding: 7px 6px 7px 9px; position: relative; overflow: hidden;
  background: oklch(var(--cb-l) var(--cb-c) var(--h)); color: oklch(var(--ct-l) var(--ct-c) var(--h));
  display: flex; flex-direction: column; transition: transform .15s var(--ease-out);
}
.cblk:active { transform: scale(.96); }
.cblk::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: oklch(var(--cr-l) var(--cr-c) var(--h)); }
.cblk b { font-size: 12.5px; line-height: 1.32; font-weight: 650; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.cblk span { margin-top: auto; font-family: var(--num); font-size: 12.5px; font-weight: 600; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cblk.ghost { background: transparent; color: var(--ink-3); border: 1.2px dashed color-mix(in oklab, var(--ink-3) 45%, transparent); }
.cblk.ghost::before { display: none; }
.cblk.ghost b { font-weight: 500; -webkit-line-clamp: 3; }
.nowline { position: absolute; left: 32px; right: 10px; height: 0; border-top: 1.5px solid var(--seal); z-index: 3; pointer-events: none; }
.nowline i { position: absolute; top: -4.5px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--seal); }
.wk-foot { display: flex; align-items: center; gap: 8px; padding: 18px 22px 0; font-size: 12px; color: var(--ink-3); }
.wk-foot i { width: 18px; height: 12px; border-radius: 4px; border: 1.2px dashed color-mix(in oklab, var(--ink-3) 60%, transparent); }

/* ---------- tools ---------- */
.page-title { font-size: 28px; font-weight: 700; margin: 0; padding: 14px 22px 8px; }
.group { margin: 18px 16px 0; }
.group h3 { margin: 0 0 8px 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.list { background: var(--surface); border-radius: 22px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; text-align: left; position: relative; }
.row:hover { background: var(--line); }
.row + .row::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; border-top: 1px solid var(--line); }
.row .ticon { width: 38px; height: 38px; border-radius: 11px; }
.row .ticon svg { width: 21px; height: 21px; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-size: 16px; font-weight: 550; }
.row .tx span { font-size: 13px; color: var(--ink-2); }
.row .val { font-size: 14px; color: var(--ink-2); }
.row .val.hot { color: var(--seal); font-weight: 600; }
.row > svg.i { width: 18px; height: 18px; color: var(--ink-3); }

/* ---------- sheet ---------- */
.scrim { position: absolute; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s; }
.sheet {
  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 41; border-radius: 34px; padding: 10px 22px 26px;
  background: var(--surface); transform: translateY(110%); transition: transform .42s var(--ease-out);
  box-shadow: 0 -10px 40px rgba(0,0,0,.14);
}
.phone.sheet-open .scrim { opacity: 1; pointer-events: auto; }
.phone.sheet-open .sheet { transform: none; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--surface-2); margin: 0 auto 18px; }
.sheet .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: oklch(var(--cb-l) var(--cb-c) var(--h)); color: oklch(var(--ct-l) var(--ct-c) var(--h)); }
.sheet h2 { margin: 10px 0 18px; font-size: 24px; line-height: 1.25; }
.sheet dl { margin: 0; display: grid; grid-template-columns: 56px 1fr; row-gap: 14px; font-size: 15px; }
.sheet dt { color: var(--ink-3); }
.sheet dd { margin: 0; }
.sheet dd .num { font-size: 17px; font-weight: 600; }
.sheet .actions { display: flex; gap: 10px; margin-top: 24px; }
.sheet .actions button { flex: 1; padding: 13px 0; border-radius: 16px; background: var(--surface-2); font-size: 15px; font-weight: 600; }
.sheet .me { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.sheet .me .avatar { width: 52px; height: 52px; font-size: 20px; }
.sheet .me b { font-size: 19px; }
.sheet .me span { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.sheet .list { background: var(--bg); }
.sheet .row .ticon { --h: 60; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="deck-head">
  <div>
    <h1>QLIT 小助手 重设计原型</h1>
    <p>三块屏幕都可以点：底栏切页、周条换天、课表左右滑换周、点课程看详情、点头像看个人页。</p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="主题">
      <button data-theme-btn="light" aria-pressed="true">浅色</button>
      <button data-theme-btn="dark" aria-pressed="false">深色</button>
    </div>
    <label class="clock">模拟时间
      <input id="clock" type="range" min="420" max="1320" step="5" value="642">
      <output id="clockOut" class="num">10:42</output>
    </label>
  </div>
</header>

<main class="deck" id="deck"></main>

      <span class="pill"></span>
      <button data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4.5V15h-5v5.5H5A1.5 1.5 0 0 1 3.5 19z"/></svg>今天</button>
      <button data-tab="week"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3.5"/><path d="M3.5 9.5h17M8.5 2.5v4M15.5 2.5v4M8 13.5h2M14 13.5h2M8 17h2"/></svg>课表</button>
      <button data-tab="tools"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/><circle cx="17" cy="17" r="3.6"/></svg>工具</button>
    </nav>

  </div>
</template>

<script>
/* ---------------- data ---------------- */
const SLOTS = [
  { k: 1, a: 1, b: 2, start: '08:30', end: '10:05' },
  { k: 2, a: 3, b: 4, start: '10:20', end: '11:55' },
  { k: 3, a: 5, b: 6, start: '12:30', end: '14:05' },
  { k: 4, a: 7, b: 8, start: '14:15', end: '15:50' },
  { k: 5, a: 9, b: 10, start: '16:00', end: '17:35' },
  { k: 6, a: 11, b: 12, start: '19:00', end: '20:35' },
];
// h = hue for the low-chroma course palette (seal-red range 15–35 kept free)
const COURSES = [
  { name: '机器学习基础', room: 'JB406', teacher: '陈思远', day: 1, slot: 1, w: [5, 16], h: 250 },
  { name: '中华诗词鉴赏', room: 'JB112', teacher: '李文博', day: 1, slot: 2, w: [1, 4], h: 70 },
  { name: '电路分析 B', room: 'JB223', teacher: '吴海峰', day: 1, slot: 3, w: [1, 16], h: 150 },
  { name: '大学英语 3', room: 'JB223', teacher: '林雪', day: 1, slot: 5, w: [1, 14], h: 320 },
  { name: '机器学习基础', room: '5208', teacher: '陈思远', day: 2, slot: 1, w: [5, 16], h: 250, note: '智能计算实验室' },
  { name: '软件需求与建模', room: 'JB320', teacher: '郑雅琴', day: 2, slot: 2, w: [1, 16], h: 95 },
  { name: '软件需求与建模', room: '4106', teacher: '郑雅琴', day: 2, slot: 4, w: [1, 16], h: 95, note: '软件工程实验室' },
  { name: '操作系统原理', room: 'JB411', teacher: '黄志明', day: 3, slot: 1, w: [1, 16], h: 285 },
  { name: '计算机网络', room: 'JB305', teacher: '马晓东', day: 3, slot: 2, w: [9, 16], h: 45 },
  { name: '模拟电子实验', room: '电子技术实验室', teacher: '宋佳', day: 4, slot: 1, w: [3, 14], h: 185 },
  { name: '概率统计 B', room: 'JB320', teacher: '唐毅', day: 4, slot: 2, w: [1, 16], h: 215 },
  { name: '电影艺术欣赏', room: 'JB203', teacher: '白露', day: 4, slot: 3, w: [5, 12], h: 350 },
  { name: 'Java 程序设计', room: 'JA118', teacher: '冯博', day: 4, slot: 4, w: [9, 16], h: 60 },
  { name: '计算机网络', room: 'JB305', teacher: '马晓东', day: 5, slot: 1, w: [9, 16], h: 45 },
  { name: 'Java 程序设计', room: 'JA118', teacher: '冯博', day: 5, slot: 2, w: [1, 16], h: 60 },
  { name: '羽毛球 3', room: '体育馆', teacher: '韩磊', day: 5, slot: 4, w: [1, 16], h: 125 },
  { name: '概率统计 B', room: 'JB208', teacher: '唐毅', day: 6, slot: 2, w: [17, 18], h: 215, note: '期末答疑' },
];COURSES.forEach((c, i) => c.id = i);
const TERM_START = new Date(2026, 8, 7); // 第 1 周周一
const TODAY = { week: 7, day: 1 };
const WD = ['一', '二', '三', '四', '五', '六', '日'];

const TOOLS = {
  bath:   { name: '浴室预约', sub: '查看空位，排队预约', h: 220, val: '空闲 4 间', short: '浴室', st: '空闲 4',
            ic: '<path d="M5 12.5a7 7 0 0 1 14 0z"/><path d="M12 5.5V3.5M8 16.5v1M12 16.5v1.5M16 16.5v1M10 20.5v.5M14 20.5v.5"/>' },
  pickup: { name: '淘宝取件', sub: '驿站取件码', h: 50, val: '2 件待取', hot: true, short: '取件', st: '2 件', badge: 2,
            ic: '<path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5l-8.5-4z"/><path d="M3.5 7.5 12 11.5l8.5-4M12 11.5v9"/>' },
  power:  { name: '电费查询', sub: '宿舍剩余电量', h: 95, val: '38.6 度', short: '电费', st: '38.6 度',
            ic: '<path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z"/>' },
  todo:   { name: '超星待办', sub: '作业与考试', h: 255, val: '3 项', hot: true, short: '待办', st: '3 项', badge: 3,
            ic: '<path d="M4.5 5A1.5 1.5 0 0 1 6 3.5h13.5v14H6a1.5 1.5 0 0 0-1.5 1.5z"/><path d="M4.5 19A1.5 1.5 0 0 0 6 20.5h13.5v-3"/><path d="m9 10.5 2 2 4-4"/>' },
  mock:   { name: '模拟定位', sub: '绘制路线，模拟轨迹', h: 150, val: '',
            ic: '<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/>' },
  nfc:    { name: 'NFC 打卡', sub: '读取打卡标签，离线重放', h: 285, val: '',
            ic: '<path d="M7.5 8a5.5 5.5 0 0 1 0 8M11 5.5a9 9 0 0 1 0 13M14.5 3a12.5 12.5 0 0 1 0 18"/>' },
};
const CHEV_R = '<svg class="i" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg>';
const CHEV_L = '<svg class="i" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg>';
const ico = (paths) => `<svg class="i" viewBox="0 0 24 24">${paths}</svg>`;

/* ---------------- helpers ---------------- */
const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmt = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const slotOf = (c) => SLOTS[c.slot - 1];
const inWeek = (c, w) => w >= c.w[0] && w <= c.w[1];
const dateOf = (week, day) => { const d = new Date(TERM_START); d.setDate(d.getDate() + (week - 1) * 7 + day - 1); return d; };
const md = (d) => `${d.getMonth() + 1}月${d.getDate()}日`;
const coursesOn = (week, day) => COURSES.filter(c => c.day === day && inWeek(c, week)).sort((a, b) => a.slot - b.slot);
const esc = (s) => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

const state = { now: 642, theme: 'light', selDay: TODAY.day, week: TODAY.week };

/* what the hero should show at state.now */
function heroModel() {
  const list = coursesOn(TODAY.week, TODAY.day);
  const now = state.now;
  for (const c of list) {
    const s = slotOf(c), st = toMin(s.start), en = toMin(s.end);
    if (now >= st && now < en) return { kind: 'now', c, left: en - now };
    if (now < st) return { kind: 'next', c, wait: st - now };
  }
  const tmr = coursesOn(TODAY.week, TODAY.day + 1)[0];
  return { kind: 'done', c: tmr };
}

function durationHTML(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  if (h === 0) return `<span class="num">${mm}</span><small>分钟</small>`;
  return `<span class="num">${h}</span><small>小时</small>${mm ? `<span class="num">${mm}</span><small>分</small>` : ''}`;
}

const SEAL = `<svg class="seal-wm" viewBox="0 0 200 200" aria-hidden="true">
  <defs><path id="arcT" d="M26 100a74 74 0 0 1 148 0"/><path id="arcB" d="M18 100a82 82 0 0 0 164 0"/></defs>
  <circle cx="100" cy="100" r="97" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <text fill="currentColor" font-size="22" font-weight="700" letter-spacing="6"><textPath href="#arcT" startOffset="50%" text-anchor="middle">齐鲁理工学院</textPath></text>
  <text fill="currentColor" font-size="13" font-weight="700" letter-spacing="1.5" font-family="system-ui"><textPath href="#arcB" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">QILU INSTITUTE OF TECHNOLOGY</textPath></text>
</svg>`;

/* ---------------- home ---------------- */
function renderHome(el) {
  const m = heroModel();
  const today = dateOf(TODAY.week, TODAY.day);
  const list = coursesOn(TODAY.week, TODAY.day);
  const dayStart = toMin(slotOf(list[0]).start) - 30, dayEnd = toMin(slotOf(list[list.length - 1]).end) + 30;
  const pct = (t) => Math.max(0, Math.min(100, (t - dayStart) / (dayEnd - dayStart) * 100));

  let top, count;
  const s = m.c && slotOf(m.c);
  if (m.kind === 'next') {
    top = `<span>下一节</span><span class="num">${s.start} – ${s.end}</span>`;
    count = `${durationHTML(m.wait)}<span class="tail">后上课</span>`;
  } else if (m.kind === 'now') {
    top = `<span>正在上课</span><span class="num">${s.start} – ${s.end}</span>`;
    count = `<span class="tail" style="margin:0 6px 0 0">还剩</span>${durationHTML(m.left)}`;
  } else {
    top = `<span>今天的课上完了，明天第一节</span><span class="num">周${WD[TODAY.day]}</span>`;
    count = `<span class="num">${s.start}</span><span class="tail">开始</span>`;
  }
  const segs = list.map(c => { const q = slotOf(c); const a = pct(toMin(q.start)), b = pct(toMin(q.end)); return `<i class="seg-c" style="left:${a}%;width:${b - a}%"></i>`; }).join('');
  const nowPct = pct(state.now);

  const hero = `<article class="hero" style="--h:${m.c.h}" data-course="${m.c.id}" tabindex="0" role="button">
      ${SEAL}
      <div class="hero-top">${top}</div>
      <h2>${esc(m.c.name)}</h2>
      <div class="hero-where"><span class="num">${esc(m.c.room)}</span><span>${esc(m.c.teacher)}</span></div>
      <div class="hero-count">${count}</div>
      ${m.kind !== 'done' ? `<div class="track">${segs}<i class="fill" style="width:${nowPct}%;opacity:.0"></i><i class="now" style="left:${nowPct}%"></i></div>
      <div class="track-scale num"><span>${fmt(dayStart + 30)}</span><span>${fmt(dayEnd - 30)}</span></div>` : ''}
    </article>`;

  const strip = WD.map((w, i) => {
    const d = i + 1, n = coursesOn(TODAY.week, d).length, dt = dateOf(TODAY.week, d);
    const cls = [d === TODAY.day && 'is-today', d === state.selDay && 'is-sel'].filter(Boolean).join(' ');
    return `<button class="${cls}" data-day="${d}" aria-pressed="${d === state.selDay}" aria-label="周${w} ${n} 节课">
        <span class="wd">${w}</span><span class="dn">${dt.getDate()}</span>
        <span class="dots">${'<i></i>'.repeat(Math.min(n, 4))}</span></button>`;
  }).join('');

  const isToday = state.selDay === TODAY.day;
  const dayList = coursesOn(TODAY.week, state.selDay);
  const selDate = dateOf(TODAY.week, state.selDay);
  let tl = '';
  dayList.forEach((c, i) => {
    const q = slotOf(c), st = toMin(q.start), en = toMin(q.end);
    if (i > 0) {
      const prevEnd = toMin(slotOf(dayList[i - 1]).end), gap = st - prevEnd;
      if (gap >= 60) tl += `<li class="gap" aria-hidden="true"><span></span><span class="rail"></span><span>空 ${Math.floor(gap / 60)} 小时${gap % 60 ? ` ${gap % 60} 分` : ''}</span></li>`;
    }
    let cls = '';
    if (isToday) {
      if (state.now >= en) cls = 'is-done';
      else if (state.now >= st) cls = 'is-now';
      else if (m.kind === 'next' && m.c === c) cls = 'is-next';
    }
    tl += `<li class="tl ${cls}" style="--h:${c.h}" data-course="${c.id}" tabindex="0">
        <span class="t"><b>${q.start}</b><span>${q.end}</span></span>
        <span class="rail"><i class="dot"></i></span>
        <span class="body"><b>${esc(c.name)}</b><span>${esc(c.teacher)}</span></span>
        <span class="room">${esc(c.room)}</span></li>`;
  });
  const remaining = isToday ? dayList.filter(c => state.now < toMin(slotOf(c).end)).length : dayList.length;
  const headRight = isToday ? (remaining ? `还有 ${remaining} 节` : '全部结束') : `${dayList.length} 节`;

  const sc = ['pickup', 'power', 'bath', 'todo'].map(k => { const t = TOOLS[k];
    return `<button data-tool="${k}"><span class="ticon" style="--h:${t.h}">${ico(t.ic)}${t.badge ? `<span class="badge">${t.badge}</span>` : ''}</span>
      <span class="lb">${t.short}</span><span class="st">${t.st}</span></button>`; }).join('');

  el.innerHTML = `
    <div class="topbar">
      <div><div class="date">${md(today)} 周${WD[TODAY.day - 1]}</div><div class="sub">第 ${TODAY.week} 周</div></div>
      <button class="avatar" data-me aria-label="个人页">林</button>
    </div>
    ${hero}
    <div class="week-strip">${strip}</div>
    <div class="day-head"><h3>${isToday ? '今天' : `周${WD[state.selDay - 1]} ${md(selDate)}`}</h3><span>${headRight}</span></div>
    ${dayList.length ? `<ol class="timeline">${tl}</ol>` : `<div class="empty-day">这天没有课</div>`}
    <div class="shortcuts">${sc}</div>`;
}

/* ---------------- week grid ---------------- */
function renderWeek(el, dir) {
  const w = state.week;
  const real = COURSES.filter(c => inWeek(c, w));
  const showSat = real.some(c => c.day === 6), showSun = real.some(c => c.day === 7);
  const days = [1, 2, 3, 4, 5].concat(showSat || showSun ? [6] : [], showSun ? [7] : []);
  const isCur = w === TODAY.week;
  const a = dateOf(w, 1), b = dateOf(w, 7);

  const head = `<div class="wk-head">
      <div><h2>第<span class="num">${w}</span>周</h2><p>${md(a)} – ${b.getMonth() === a.getMonth() ? b.getDate() + '日' : md(b)}${isCur ? '，本周' : ''}</p></div>
      <div class="wk-nav">
        ${isCur ? '' : '<button class="back" data-week="cur">回到本周</button>'}
        <button class="ic" data-week="-1" aria-label="上一周" ${w <= 1 ? 'disabled' : ''}>${CHEV_L}</button>
        <button class="ic" data-week="1" aria-label="下一周" ${w >= 18 ? 'disabled' : ''}>${CHEV_R}</button>
      </div></div>`;

  const dayHead = `<div class="days" style="--cols:${days.length}"><span></span>${days.map(d => {
      const t = isCur && d === TODAY.day;
      return `<div class="${t ? 'is-today' : ''}">${WD[d - 1]}<b>${dateOf(w, d).getDate()}</b></div>`; }).join('')}</div>`;

  let cells = '';
  SLOTS.forEach(s => {
    cells += `<div class="sec"><span>${s.a}</span><span>${s.b}</span></div>`;
    days.forEach(d => {
      const here = COURSES.filter(c => c.day === d && c.slot === s.k);
      const on = here.find(c => inWeek(c, w)), off = here.find(c => !inWeek(c, w));
      const today = isCur && d === TODAY.day;
      let inner = '';
      if (on) inner = `<button class="cblk" style="--h:${on.h}" data-course="${on.id}"><b>${esc(on.name)}</b><span>${esc(on.room)}</span></button>`;
      else if (off) inner = `<button class="cblk ghost" data-course="${off.id}" aria-label="${esc(off.name)}，本周不上"><b>${esc(off.name)}</b></button>`;
      cells += `<div class="cell${today ? ' today' : ''}">${inner}</div>`;
    });
  });

  // red now-line, only in the current week and inside teaching hours
  let line = '';
  if (isCur) {
    const ROW = 104, GAP = 4, n = state.now;
    let y = null;
    SLOTS.forEach((s, i) => {
      const st = toMin(s.start), en = toMin(s.end), top = i * (ROW + GAP);
      if (n >= st && n < en) y = top + (n - st) / (en - st) * ROW;
      const next = SLOTS[i + 1];
      if (next && n >= en && n < toMin(next.start)) y = top + ROW + GAP / 2;
    });
    if (y !== null) {
      const col = days.indexOf(TODAY.day);
      line = `<div class="nowline" style="top:${y}px" data-t="${fmt(n)}"><i style="left:calc((100% - ${(days.length - 1) * 4}px) / ${days.length} * ${col} + ${col * 4}px)"></i></div>`;
    }
  }

  const hasGhost = days.some(d => SLOTS.some(s => COURSES.some(c => c.day === d && c.slot === s.k && !inWeek(c, w)) && !COURSES.some(c => c.day === d && c.slot === s.k && inWeek(c, w))));
  const hidden = !days.includes(7) ? (days.includes(6) ? '周日' : '周末') : '';
  el.innerHTML = `${head}
    <div class="grid-wrap${dir ? (dir > 0 ? ' anim-l' : ' anim-r') : ''}">
      ${dayHead}
      <div class="grid" style="--cols:${days.length}">${cells}${line}</div>
      <div class="wk-foot">${hasGhost ? '<i></i><span>虚线是本周不上的课</span>' : ''}${hidden ? `<span style="margin-left:auto">${hidden}没课，已收起</span>` : ''}</div>
    </div>`;
}

/* ---------------- tools ---------------- */
function renderTools(el) {
  const row = (k) => { const t = TOOLS[k];
    return `<button class="row" data-tool="${k}"><span class="ticon" style="--h:${t.h}">${ico(t.ic)}</span>
      <span class="tx"><b>${t.name}</b><span>${t.sub}</span></span>
      ${t.val ? `<span class="val${t.hot ? ' hot' : ''}">${t.val}</span>` : ''}${CHEV_R}</button>`; };
  el.innerHTML = `<h1 class="page-title">工具</h1>
    <section class="group"><h3>校园生活</h3><div class="list">${['pickup', 'bath', 'power'].map(row).join('')}</div></section>
    <section class="group"><h3>学习</h3><div class="list">${row('todo')}</div></section>
    <section class="group"><h3>实验功能</h3><div class="list">${['mock', 'nfc'].map(row).join('')}</div></section>`;
}

/* ---------------- sheets ---------------- */
function courseSheet(c) {
  const s = slotOf(c);
  const thisWeek = inWeek(c, state.week);
  return `<div class="grab"></div>
    <span class="chip" style="--h:${c.h}">${thisWeek ? `周${WD[c.day - 1]}` : '本周不上'}</span>
    <h2>${esc(c.name)}</h2>
    <dl>
      <dt>时间</dt><dd>周${WD[c.day - 1]} 第 ${s.a}–${s.b} 节　<span class="num">${s.start} – ${s.end}</span></dd>
      <dt>地点</dt><dd><span class="num">${esc(c.room)}</span>${c.note ? `　${esc(c.note)}` : ''}</dd>
      <dt>教师</dt><dd>${esc(c.teacher)}</dd>
      <dt>周次</dt><dd>第 <span class="num">${c.w[0]}–${c.w[1]}</span> 周</dd>
    </dl>
    <div class="actions"><button data-close>编辑课程</button><button data-close>关闭</button></div>`;
}
function meSheet() {
  const r = (h, ic, name, val) => `<button class="row" data-close><span class="ticon" style="--h:${h}">${ico(ic)}</span><span class="tx"><b>${name}</b></span>${val ? `<span class="val">${val}</span>` : ''}${CHEV_R}</button>`;
  return `<div class="grab"></div>
    <div class="me"><span class="avatar">林</span><div><b>林一舟</b><span>课表导入于 10月19日 00:22</span></div></div>
    <div class="list">
      ${r(250, '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>', '设置', '')}
      ${r(150, '<path d="M19.5 11a7.5 7.5 0 0 0-13.4-4.6L4.5 8.5"/><path d="M4.5 4v4.5H9"/><path d="M4.5 13a7.5 7.5 0 0 0 13.4 4.6l1.6-2.1"/><path d="M19.5 20v-4.5H15"/>', '检查更新', 'V2.0.3')}
      ${r(60, '<path d="M4.5 6A1.5 1.5 0 0 1 6 4.5h12A1.5 1.5 0 0 1 19.5 6v9a1.5 1.5 0 0 1-1.5 1.5H9.5l-5 4z"/>', '意见反馈', '')}
      ${r(320, '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.2"/>', '关于 QLIT 小助手', '')}
    </div>`;
}

/* ---------------- phones ---------------- */
const phones = [];
const CAPTIONS = {
  home: '<b>今天</b>：下一节课是整页唯一的红色。倒计时、教室号放大，底下的细轨道标出今天每节课的位置和此刻。周条点别的天，下面的时间轴跟着换。',
  week: '<b>课表</b>：不再套卡片，课程块直接铺在纸面上。没课的周末自动收起，五列比原来宽约 40%。红线是此刻，左右滑动换周。',
  tools: '<b>工具</b>：彩色图标块加分组，状态写在行尾，红色只留给需要你处理的事。原来的“关于”收进今天页右上角的头像。',
};
function mountPhone(tab) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.append(document.getElementById('phoneTpl').content.cloneNode(true));
  const cap = document.createElement('p'); cap.className = 'caption'; slot.append(cap);
  document.getElementById('deck').append(slot);
  const el = slot.querySelector('.phone');
  const p = { el, cap, tab, screens: {} };
  el.querySelectorAll('.screen').forEach(s => p.screens[s.dataset.screen] = s);
  phones.push(p);

  el.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-course], [data-me]');
    if (!t || !el.contains(t)) return;
    if (t.closest('.scrim')) return;
    if (t.dataset.tab) return setTab(p, t.dataset.tab);
    if (t.dataset.day) { state.selDay = +t.dataset.day; return renderAll(); }
    if (t.dataset.week) { changeWeek(t.dataset.week === 'cur' ? TODAY.week - state.week : +t.dataset.week); return; }
    if (t.hasAttribute('data-close')) return closeSheet(p);
    if (t.hasAttribute('data-me')) return openSheet(p, meSheet());
    if (t.dataset.tool && t.dataset.tool === 'todo') return;
    if (t.dataset.course !== undefined && !t.closest('.sheet')) return openSheet(p, courseSheet(COURSES[+t.dataset.course]));
  });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSheet(p);
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-course][tabindex]')) { e.preventDefault(); e.target.click(); }
  });
  el.querySelector('.scrim').addEventListener('click', () => closeSheet(p));

  // horizontal swipe on the week grid changes week
  let sx = null, sy = null;
  p.screens.week.addEventListener('pointerdown', (e) => { if (e.target.closest('.grid-wrap')) { sx = e.clientX; sy = e.clientY; } });
  p.screens.week.addEventListener('pointerup', (e) => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) changeWeek(dx < 0 ? 1 : -1);
  });
  setTab(p, tab);
}
function setTab(p, tab) {
  p.tab = tab;
  Object.entries(p.screens).forEach(([k, s]) => s.hidden = k !== tab);
  const idx = ['home', 'week', 'tools'].indexOf(tab);
  p.el.querySelector('.pill').style.transform = `translateX(${idx * 78}px)`;
  p.el.querySelectorAll('.tabbar button').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  p.cap.innerHTML = CAPTIONS[tab];
}
function openSheet(p, html) {
  const sh = p.el.querySelector('.sheet');
  sh.innerHTML = html;
  p.el.classList.add('sheet-open');
  sh.querySelector('button')?.focus({ preventScroll: true });
}
function closeSheet(p) { p.el.classList.remove('sheet-open'); }
function changeWeek(d) {
  const nw = Math.max(1, Math.min(18, state.week + d));
  if (nw === state.week) return;
  state.week = nw;
  phones.forEach(p => renderWeek(p.screens.week, d));
}
function renderAll() {
  phones.forEach(p => {
    renderHome(p.screens.home);
    renderWeek(p.screens.week, 0);
    renderTools(p.screens.tools);
    p.el.querySelector('.st-time').textContent = fmt(state.now);
  });
}

/* ---------------- controls ---------------- */
document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => {
  state.theme = b.dataset.themeBtn;
  document.documentElement.dataset.theme = state.theme;
  document.querySelectorAll('[data-theme-btn]').forEach(x => x.setAttribute('aria-pressed', x === b));
}));
const clock = document.getElementById('clock'), clockOut = document.getElementById('clockOut');
clock.addEventListener('input', () => { state.now = +clock.value; clockOut.textContent = fmt(state.now); renderAll(); });

mountPhone('home');
mountPhone('week');
mountPhone('tools');
renderAll();
</script>
</body>
